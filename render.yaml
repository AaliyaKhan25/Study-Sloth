services:
  - type: web
    name: study-sloth-online
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn online:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: SLOTH_MODEL
        value: qwen3:4b
      - key: SLOTH_VISION_MODEL
        value: qwen3-vl:4b-instruct

  - type: web
    name: study-sloth-hosted
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: study-sloth-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SLOTH_DB
        value: /var/data/template.db
      - key: SLOTH_UPLOAD_DIR
        value: /var/data/uploads
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: SLOTH_MODEL
        value: qwen3:4b
      - key: SLOTH_VISION_MODEL
        value: qwen3-vl:4b-instruct
