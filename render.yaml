services:
  - type: web
    name: study-sloth-online
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn online:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: SLOTH_MODEL
        value: gemma4:cloud
      - key: SLOTH_VISION_MODEL
        value: qwen3-vl:4b-instruct

  - type: web
    name: study-sloth-hosted
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: SLOTH_MODEL
        value: gemma4:cloud
      - key: SLOTH_VISION_MODEL
        value: qwen3-vl:4b-instruct
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
