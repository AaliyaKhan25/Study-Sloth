<title>Study Sloth · your learning desk</title>
<style>
:root{color-scheme:light;--paper:#f6f9f6;--surface:#fff;--ink:#24372e;--muted:#637268;--forest:#315b43;--forest-dark:#234532;--leaf:#e8f0e8;--sun:#d7a653;--sun-pale:#fbf2df;--coral:#bd684d;--coral-pale:#f7e8e1;--blue:#78a7b3;--blue-pale:#e8f1f3;--line:#dfe7df;--shadow:0 18px 50px rgba(40,65,47,.08);--radius:22px}

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,rgba(215,166,83,.11),transparent 34%),var(--paper);color:var(--ink);font:15px/1.55 "Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{color:inherit}h1,h2,h3,h4,p{margin-top:0}h1,h2,h3,h4{font-family:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.025em}h1{font-size:1.45rem}h2{font-size:clamp(2rem,3vw,3.2rem);line-height:1.08;margin:.35rem 0 .65rem}h3{font-size:1.3rem;margin-bottom:.4rem}p{color:var(--muted)}
.shell{min-height:100vh;display:grid;grid-template-columns:278px minmax(0,1fr)}

.side-section{display:grid;gap:11px}.side-label{padding:0 8px;color:#b7cabb;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:750}.subjects{display:grid;gap:5px}.subject-btn{border:0;background:transparent;color:#e0e9df;text-align:left;padding:10px 11px;border-radius:13px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:.18s}.subject-btn:hover{background:rgba(255,255,255,.1);transform:translateX(2px)}.subject-btn.on{background:#f7f4eb;color:#294b3b;font-weight:750;box-shadow:0 8px 20px rgba(9,25,17,.12)}.subject-glyph{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:.88rem}.subject-btn.on .subject-glyph{background:#e4eddc}.empty-subjects{padding:8px 10px;color:#cfdbcd;font-size:.86rem}
.new-subject{display:flex;gap:7px;padding:5px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:rgba(255,255,255,.08)}.new-subject input{min-width:0;width:100%;border:0;background:transparent;color:white;padding:8px 7px;outline:0}.new-subject input::placeholder{color:#c7d5c7}.new-subject button{width:36px;height:36px;flex:none;border:0;border-radius:10px;background:var(--sun);color:#3f4229;font-size:1.25rem;font-weight:800;cursor:pointer;transition:.18s}.new-subject button:hover{transform:rotate(90deg);background:#f4d77e}.side-foot{margin-top:auto;padding:15px 11px 5px;color:#c2d2c4;font-size:.78rem;border-top:1px solid rgba(255,255,255,.14)}.side-foot strong{display:block;color:#fff;margin-bottom:4px}
.main-wrap{min-width:0}.main{max-width:1280px;margin:0 auto;padding:28px clamp(20px,4vw,58px) 112px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.eyebrow{color:var(--forest);font-size:.72rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.topbar-note{color:var(--muted);font-size:.84rem}.topbar-right{display:flex;align-items:center;gap:12px}.avatar{height:39px;width:39px;border-radius:14px;display:grid;place-items:center;background:var(--sun-pale);color:#805c24;font-weight:800}
.hero{position:relative;overflow:hidden;min-height:245px;padding:clamp(26px,4vw,46px);border-radius:30px;background:linear-gradient(115deg,#f0f6ef 0%,#f8faf6 58%,#fbf5e9 100%);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:20px}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.hero:before{width:330px;height:330px;right:9%;top:-210px;border:1px solid rgba(49,87,71,.12)}.hero:after{width:260px;height:260px;right:16%;bottom:-225px;border:1px solid rgba(49,87,71,.12)}.hero-copy{position:relative;z-index:1;max-width:680px}.hero .eyebrow{color:#46694e}.hero h2{color:#263e31}.hero h2 em{font-style:normal;color:#9b613c}.hero-copy p{max-width:590px;color:#53675a;margin-bottom:17px}.hero-meta{display:flex;flex-wrap:wrap;gap:8px}.hero-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid rgba(49,87,71,.12);font-size:.77rem;color:#405b45;font-weight:700}.hero-logo{position:relative;z-index:1;width:clamp(116px,15vw,178px);height:clamp(116px,15vw,178px);border-radius:50%;object-fit:cover;border:7px solid rgba(255,255,255,.9);box-shadow:0 16px 32px rgba(71,63,39,.16);flex:none}
.welcome{min-height:320px}.welcome .hero-logo{width:clamp(150px,21vw,230px);height:clamp(150px,21vw,230px)}.welcome-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.welcome-step{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 25px rgba(42,64,49,.035)}.welcome-step span{display:grid;place-items:center;width:35px;height:35px;border-radius:12px;background:var(--sun-pale);margin-bottom:12px}.welcome-step h3{font-size:1.08rem}.welcome-step p{font-size:.86rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:17px 0 21px}.stat{padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:13px;box-shadow:0 8px 25px rgba(42,64,49,.035)}.stat-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.15rem;flex:none}.stat:nth-child(1) .stat-icon{background:var(--leaf)}.stat:nth-child(2) .stat-icon{background:var(--sun-pale)}.stat:nth-child(3) .stat-icon{background:var(--coral-pale)}.stat:nth-child(4) .stat-icon{background:var(--blue-pale)}.stat strong{display:block;font:750 1.5rem/1 "Poppins",ui-sans-serif,system-ui,sans-serif}.stat small{display:block;margin-top:5px;color:var(--muted);font-size:.74rem}
.tabs{display:flex;gap:8px;padding:7px;margin:18px 0 24px;background:rgba(231,234,223,.72);border:1px solid var(--line);border-radius:17px;width:max-content;max-width:100%;overflow:auto}.tabs button{white-space:nowrap;border:0;border-radius:12px;background:transparent;padding:10px 15px;color:var(--muted);font-weight:700;cursor:pointer;transition:.18s}.tabs button:hover{color:var(--ink);background:rgba(255,255,255,.6)}.tabs button.on{background:var(--surface);color:var(--forest);box-shadow:0 4px 12px rgba(42,64,49,.08)}
.section-heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:7px 0 16px}.section-heading h3{font-size:1.65rem;margin:4px 0 0}.section-heading p{margin:5px 0 0;font-size:.9rem}.section-kicker{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--coral)}.card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.action-card{position:relative;overflow:hidden;padding:22px;border-radius:22px;border:1px solid var(--line);background:var(--surface);box-shadow:0 10px 28px rgba(42,64,49,.045);transition:transform .2s,box-shadow .2s}.action-card:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(42,64,49,.09)}.action-card.audio{background:linear-gradient(140deg,var(--surface),var(--leaf))}.action-card.pdf{background:linear-gradient(140deg,var(--surface),var(--sun-pale))}.action-card:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-80px;top:-90px;border:1px solid rgba(49,87,71,.12)}.action-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}.action-icon{height:48px;width:48px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.76);font-size:1.35rem;box-shadow:0 5px 16px rgba(46,66,52,.08)}.action-card h4{font:750 1.16rem/1.2 system-ui,sans-serif;margin:0}.action-card .hint{font-size:.85rem;margin:0 0 16px;max-width:480px}.field-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.field-row input[type=text]{flex:1;min-width:180px}.input,textarea{width:100%;padding:11px 13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;outline:0;transition:border .16s,box-shadow .16s}.input:focus,textarea:focus,input:focus{border-color:#8da98d;box-shadow:0 0 0 4px rgba(95,130,99,.13)}input[type=file]{max-width:100%;font-size:.8rem;color:var(--muted)}input[type=file]::file-selector-button{border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--forest);padding:8px 11px;margin-right:10px;font-weight:700;cursor:pointer}.primary{border:0;border-radius:12px;padding:11px 15px;background:var(--forest);color:#fffdf8;font-weight:800;cursor:pointer;box-shadow:0 6px 14px rgba(49,87,71,.17);transition:.18s}.primary:hover{transform:translateY(-1px);background:var(--forest-dark);box-shadow:0 9px 19px rgba(49,87,71,.22)}.primary:disabled{opacity:.55;cursor:wait;transform:none}.full{width:100%}.upload-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:10px}.upload-row input[type=file]{grid-column:1/-1}.privacy-note{display:flex;align-items:center;gap:7px;color:var(--forest);font-size:.75rem;font-weight:700;margin-top:13px}
.list-heading{display:flex;align-items:center;justify-content:space-between;margin:28px 0 10px}.list-heading h3{font-size:1.4rem;margin:0}.list-heading span{font-size:.8rem;color:var(--muted)}.item-list{display:grid;gap:10px}.item-card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:15px 17px;box-shadow:0 6px 20px rgba(42,64,49,.035)}.item-row{display:flex;align-items:center;gap:12px}.item-icon{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--coral-pale);font-size:1.1rem}.item-icon.pdf-icon{background:var(--sun-pale)}.item-info{flex:1;min-width:0}.item-info strong{display:block;overflow-wrap:anywhere}.item-info small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}.quiet-button{border:1px solid var(--line);border-radius:11px;padding:8px 11px;background:var(--surface);color:var(--forest);font-size:.83rem;font-weight:750;cursor:pointer}.quiet-button:hover{background:var(--leaf)}.empty-card{padding:25px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted);background:rgba(255,253,248,.48)}
.notes-output{margin-top:15px;padding:20px;border-radius:16px;background:var(--paper);border:1px solid var(--line);overflow:auto}.notes-output h2,.notes-output h3,.notes-output h4{color:var(--forest);margin:17px 0 8px}.notes-output p{color:var(--ink);margin:6px 0}.notes-output .bullet{padding:4px 0 4px 20px;position:relative}.notes-output .bullet:before{content:"✦";color:var(--coral);position:absolute;left:0}.notes-output .numbered{padding:4px 0 4px 22px}.notes-output code{font-family:ui-monospace,monospace;background:var(--surface);padding:2px 5px;border-radius:5px}
.unit-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.unit-card{padding:20px;border-radius:19px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 25px rgba(42,64,49,.035)}.unit-number{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;background:var(--sun-pale);color:#8d6824;font-weight:850;margin-bottom:12px}.topic-chip{display:inline-block;background:var(--leaf);color:var(--forest);padding:5px 9px;border-radius:999px;font-size:.75rem;margin:4px 3px 0 0}.form-stack{display:grid;gap:10px}.form-stack label{font-size:.83rem;font-weight:750}.study-section{margin-top:26px}.quiz-option{display:flex;align-items:center;gap:9px;font-weight:450!important;margin:8px 0!important}.flash-card{min-height:106px;display:grid;place-items:center;text-align:center;padding:22px;border-radius:18px;background:linear-gradient(135deg,var(--leaf),var(--surface));border:1px solid var(--line);cursor:pointer;transition:.2s}.flash-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.flash-card.flipped{background:linear-gradient(135deg,var(--sun-pale),var(--surface))}.warn{color:#af4e39}.error-line{font-size:.82rem;color:var(--bad,#af4e39)}
#jobs{position:fixed;z-index:8;bottom:16px;left:calc(278px + 20px);right:20px;max-width:860px;margin-left:auto;padding:12px 16px;border-radius:16px;background:var(--forest-dark);color:#f8f6ec;box-shadow:0 12px 32px rgba(22,48,34,.25);font-size:.85rem;display:flex;align-items:center;gap:12px}#jobs[hidden]{display:none}#jobs progress{height:9px;max-width:230px;flex:1;accent-color:var(--sun)}.job-spark{font-size:1.1rem}.local-footer{display:flex;justify-content:center;color:var(--muted);font-size:.77rem;margin:28px 0 4px;gap:8px;align-items:center}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}button:focus-visible,input:focus-visible{outline-offset:2px}
@media(max-width:1000px){.shell{grid-template-columns:230px minmax(0,1fr)}.sidebar{padding:20px 14px}.main{padding:23px 24px 100px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-logo{width:128px;height:128px}#jobs{left:250px}}
@media(max-width:700px){.shell{display:block}.sidebar{height:auto;position:relative;padding:14px 16px;gap:13px}.brand{padding:0 0 12px}.brand-mark{height:48px;width:48px;border-radius:15px}.sidebar .side-section{gap:7px}.sidebar .side-label{padding-left:3px}.subjects{display:flex;overflow:auto;padding-bottom:2px}.subject-btn{white-space:nowrap;flex:none}.subject-glyph{width:24px;height:24px}.side-foot{display:none}.main{padding:18px 15px 110px}.topbar{margin-bottom:16px}.topbar-note{font-size:.74rem}.hero{padding:24px 20px;min-height:210px;border-radius:23px}.hero-logo{width:85px;height:85px;border-width:4px}.welcome .hero-logo{width:100px;height:100px}.hero h2{font-size:2rem}.hero-copy p{font-size:.87rem}.hero-chip{font-size:.68rem}.stats{gap:8px}.stat{padding:12px 11px;gap:8px;border-radius:15px}.stat-icon{width:35px;height:35px;border-radius:11px}.stat strong{font-size:1.2rem}.stat small{font-size:.67rem}.tabs{width:100%;gap:3px;margin:14px 0 20px}.tabs button{padding:9px 10px;font-size:.82rem}.card-grid,.unit-list,.welcome-steps{grid-template-columns:1fr}.action-card{padding:18px}.upload-row{grid-template-columns:1fr}.upload-row input[type=file]{grid-column:auto}.upload-row .primary{width:100%}.section-heading{align-items:start;flex-direction:column}.item-row{align-items:flex-start;flex-wrap:wrap}.item-row .quiet-button{margin-left:52px}#jobs{left:12px;right:12px;bottom:10px;padding:10px 12px}#jobs progress{max-width:85px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.primary{color:#fffdf8}
.tabs{background:var(--leaf)}
.tabs button{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.tabs button:hover{background:var(--surface);border-color:var(--forest)}
.tabs button.on{background:var(--forest);color:#fffdf8}
.error-dialog{width:min(440px,calc(100vw - 32px));padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.error-dialog::backdrop{background:rgba(7,17,12,.58)}
.error-dialog h2{font-size:1.45rem;color:var(--ink)}
.error-dialog p{color:var(--ink);overflow-wrap:anywhere}
.error-dialog-actions{display:flex;justify-content:flex-end}
.warn,.error-line,.manual-status.error{color:#a7321f}
#jobs{background:#203e32;color:#fffdf8}
#jobs progress{color-scheme:light;background:#fffdf8;border:1px solid rgba(255,255,255,.75);border-radius:999px;overflow:hidden}
.student-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.manual-notice{padding:12px 14px;border:1px solid var(--sun);border-radius:12px;background:var(--sun-pale);color:var(--ink);font-size:.83rem}
.manual-output-review{margin-top:18px}
.manual-index{min-height:140px}
.manual-status{font-size:.82rem;color:var(--muted)}
.manual-status.error{color:var(--coral);font-weight:700}

</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark"><img src="/logo.png" alt="Study Sloth, a sloth studying at a desk"></div><div><h1>Study Sloth</h1><small>Your learning desk</small></div></div>
    <div class="local-badge"><span class="local-dot"></span>Local AI · your device</div>
    <section class="side-section"><div class="side-label">Your subjects</div><div id="subs" class="subjects"></div>
      <form class="new-subject" onsubmit="newSub(event)"><input id="subjectName" placeholder="Add a subject…" aria-label="New subject name" required><button aria-label="Create subject" title="Create subject">+</button></form>
    </section>
    <div class="side-foot"><strong>A little progress adds up.</strong>One focused session at a time ✦</div>
  </aside>
  <div class="main-wrap"><main id="main" class="main"></main></div>
</div>
<div id="jobs" hidden></div>
<dialog id="errorDialog" class="error-dialog" role="alertdialog" aria-labelledby="errorTitle" aria-describedby="errorMessage">
  <h2 id="errorTitle">Something went wrong</h2>
  <p id="errorMessage"></p>
  <div class="error-dialog-actions"><button class="primary" onclick="$('errorDialog').close()">Close</button></div>
</dialog>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o){const r=await fetch('/api'+p,o);if(!r.ok){let m=await r.text();try{m=JSON.parse(m).detail}catch(e){}throw new Error(m)}return r.json()}
const post=(p,fd)=>api(p,{method:'POST',body:fd});
const J=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const fd=f=>new FormData(f);
let D=null,tab='notes',sid=null,wasBusy=false,manualCardsRequested=new Set();
const tabNames={notes:'Notes',study:'Study deck',labs:'Lab records',syllabus:'Syllabus'};
async function subs(){const l=await api('/subjects');$('subs').innerHTML=l.length?l.map((s,i)=>`<button class="subject-btn ${s.id==sid?'on':''}" onclick="open_(${s.id})"><span class="subject-glyph">${['◈','✿','⌘','✦'][i%4]}</span><span>${esc(s.name)}</span></button>`).join(''):'<div class="empty-subjects">Your first subject is one click away.</div>'}
async function newSub(e){e.preventDefault();const f=new FormData();f.append('name',$('subjectName').value.trim());if(!f.get('name'))return;try{const r=await post('/subjects',f);$('subjectName').value='';await open_(r.id)}catch(x){err(x)}}
async function open_(id){sid=id;D=await api('/subjects/'+id);await subs();draw()}
function setTab(t){tab=t;draw()}
function err(e){const dialog=$('errorDialog');$('errorMessage').textContent=e instanceof Error?e.message:String(e);if(!dialog.open)dialog.showModal()}
async function send(e,path){e.preventDefault();const form=e.target,button=form.querySelector('button');if(button){button.disabled=true;button.dataset.label=button.textContent;button.textContent='Uploading and queueing…'}try{await post(path,fd(form));form.reset();poll()}catch(x){err(x)}finally{if(button){button.disabled=false;button.textContent=button.dataset.label||'Submit'}}}
function hero(title,sub,large=false){return `<section class="hero ${large?'welcome':''}"><div class="hero-copy"><div class="eyebrow">A calmer way to study</div><h2>${title}</h2><p>${sub}</p><div class="hero-meta"><span class="hero-chip">✦ Break big topics into small wins</span><span class="hero-chip">◉ Everything runs locally</span></div></div><img class="hero-logo" src="/logo.png" alt="The Study Sloth mascot studying"></section>`}
function footer(){return `<div class="local-footer"><span class="local-dot"></span>Made for focused learning · Powered locally on your computer</div>`}
function draw(){
 if(!D){$('main').innerHTML=`<div class="topbar"><span class="eyebrow">WELCOME TO YOUR STUDY SPACE</span><div class="topbar-right"><span class="topbar-note">Private by design</span><span class="avatar">✦</span></div></div>${hero('Make room for <em>more learning.</em>','Turn lectures, syllabi and long reading into clear notes and useful practice — all from your own computer.',true)}<div class="welcome-steps"><div class="welcome-step"><span>📚</span><h3>Start with a subject</h3><p>Create a subject in the sidebar to give each course its own study desk.</p></div><div class="welcome-step"><span>🪄</span><h3>Bring your material</h3><p>Add a syllabus, lecture recording or a long PDF and let Study Sloth organize it.</p></div><div class="welcome-step"><span>🧠</span><h3>Learn actively</h3><p>Review clear notes, flashcards, quizzes and viva questions as you go.</p></div></div>${footer()}`;return}
 const s=D.subject,doneLectures=D.lectures.filter(x=>x.t).length,donePdfs=D.pdf_notes.filter(x=>x.note_chars).length;
 $('main').innerHTML=`<div class="topbar"><span class="eyebrow">YOUR LEARNING DESK</span><div class="topbar-right"><span class="topbar-note">Local workspace · just for you</span><span class="avatar">✦</span></div></div>${hero(`Let’s make <em>${esc(s.name)}</em> stick.`,'Your course materials, notes and practice — gathered in one calm place.')}<section class="stats"><div class="stat"><span class="stat-icon">🧭</span><div><strong>${s.units.length}</strong><small>Syllabus units</small></div></div><div class="stat"><span class="stat-icon">🎧</span><div><strong>${doneLectures}</strong><small>Lecture notes</small></div></div><div class="stat"><span class="stat-icon">📄</span><div><strong>${donePdfs}</strong><small>PDF summaries</small></div></div><div class="stat"><span class="stat-icon">🧪</span><div><strong>${D.labs.length}</strong><small>Lab records</small></div></div></section><nav class="tabs" aria-label="Subject sections">${Object.entries(tabNames).map(([k,v])=>`<button class="${tab==k?'on':''}" aria-current="${tab==k?'page':'false'}" onclick="setTab('${k}')">${v}</button>`).join('')}</nav><section id="tab"></section>${footer()}`;
 ({notes:tNotes,study:tStudy,labs:tLabs,syllabus:tSyl})[tab]();
 if(tab==='study')ensureManualStudyCards();
}
function ensureManualStudyCards(){D.lab_manuals.filter(m=>m.status==='done'&&!m.study_card_count&&!manualCardsRequested.has(m.id)).forEach(m=>{manualCardsRequested.add(m.id);api('/lab-manuals/'+m.id+'/study-cards',{method:'POST'}).then(()=>poll()).catch(error=>{manualCardsRequested.delete(m.id);err(error)})})}
async function tNotes(){
 $('tab').innerHTML=`<div class="section-heading"><div><div class="section-kicker">BUILD YOUR LIBRARY</div><h3>What are we studying today?</h3><p>Bring a lecture or a long PDF. Your local models will handle the busywork.</p></div><span class="local-badge" style="background:var(--leaf);border-color:var(--line);color:var(--forest)"><span class="local-dot"></span>On-device processing</span></div>
 <div class="card-grid"><form class="action-card audio" onsubmit="send(event,'/subjects/${sid}/lectures')"><div class="action-top"><span class="action-icon">🎧</span><div><h4>Turn a lecture into notes</h4><span class="topbar-note">Transcript · timestamps · study set</span></div></div><p class="hint">Upload a recording to get a timestamped transcript, notes by unit, flashcards, a quiz and viva practice.</p><div class="form-stack"><label for="lectureTitle">Lecture name</label><input class="input" id="lectureTitle" name="title" placeholder="e.g. Joins and subqueries" required><div class="upload-row"><input type="file" name="file" accept="audio/*,video/*" required aria-label="Lecture recording"><button class="primary" type="submit">Make lecture notes <span aria-hidden="true">↗</span></button></div></div><div class="privacy-note">◉ Audio stays on this computer</div></form>
 <form class="action-card pdf" onsubmit="send(event,'/subjects/${sid}/pdf-notes')"><div class="action-top"><span class="action-icon">📄</span><div><h4>Make notes and cards from a PDF</h4><span class="topbar-note">Great for long readings</span></div></div><p class="hint">Study Sloth extracts text or OCRs scanned pages, summarizes the material, and creates flashcards, a quiz and viva practice.</p><div class="form-stack"><label for="pdfTitle">Document name <span class="topbar-note">(optional)</span></label><input class="input" id="pdfTitle" name="title" placeholder="e.g. Chapter 4 · Data structures"><div class="upload-row"><input type="file" name="file" accept=".pdf,application/pdf" required aria-label="PDF to summarize"><button class="primary" type="submit">Create PDF study set <span aria-hidden="true">↗</span></button></div></div><div class="privacy-note">◉ Scanned page images and PDF text are sent to the configured AI model</div></form></div>
 ${pdfLibrary()}${lectureLibrary()}`;
}
function pdfLibrary(){return `<div class="list-heading"><h3>PDF reading notes</h3><span>${D.pdf_notes.length} ${D.pdf_notes.length===1?'document':'documents'}</span></div>${D.pdf_notes.length?`<div class="item-list">${D.pdf_notes.map(n=>`<article class="item-card"><div class="item-row"><span class="item-icon pdf-icon">📄</span><div class="item-info"><strong>${esc(n.title)}</strong><small>${esc(n.source_name)} · ${n.status==='done'?'Notes and study set ready':n.status==='error'?'Could not finish PDF study set':n.note_chars?'Notes ready · making study cards':'In the queue'}</small></div>${n.note_chars?`<button class="quiet-button" onclick="showPdfNotes(${n.id})">${$(`pdfbody${n.id}`)?'Hide notes':'Read notes'} ↗</button>`:''}${n.status==='done'?'<button class="quiet-button" onclick="setTab(&#39;study&#39;)">Practice cards ↗</button>':n.status==='error'?'<span class="error-line">Job failed</span>':'<span class="topbar-note">Working…</span>'}</div><div id="pdfbody${n.id}"></div></article>`).join('')}</div>`:'<div class="empty-card">Your PDF notes will collect here. Add a long reading above to get started. ✦</div>'}`}
function lectureLibrary(){return `<div class="list-heading"><h3>Lecture notebook</h3><span>${D.lectures.length} ${D.lectures.length===1?'recording':'recordings'}</span></div>${D.lectures.length?`<div class="item-list">${D.lectures.map(l=>`<article class="item-card"><div class="item-row"><span class="item-icon">🎧</span><div class="item-info"><strong>${esc(l.title)}</strong><small>${l.t?'Transcript and notes ready':'Processing recording'}</small></div>${l.t?`<button class="quiet-button" onclick="showLec(${l.id})">Open notebook ↗</button>`:'<span class="topbar-note">Working…</span>'}<label class="quiet-button" style="cursor:pointer">Add board photo<input type="file" accept="image/*" onchange="board(${l.id},this)" hidden></label></div><div id="lec${l.id}"></div></article>`).join('')}</div>`:'<div class="empty-card">No lectures yet. Upload a recording and your notebook will appear here. 🎙️</div>'}`}
function noteMarkup(text){return String(text||'').split(/\r?\n/).map(line=>{const safe=esc(line);if(/^###\s/.test(line))return `<h4>${safe.slice(4)}</h4>`;if(/^##\s/.test(line))return `<h3>${safe.slice(3)}</h3>`;if(/^#\s/.test(line))return `<h2>${safe.slice(2)}</h2>`;if(/^[-*]\s/.test(line))return `<div class="bullet">${safe.slice(2)}</div>`;if(/^\d+[.)]\s/.test(line))return `<div class="numbered">${safe}</div>`;return safe?`<p>${safe}</p>`:''}).join('')}
async function showPdfNotes(id){const slot=$(`pdfbody${id}`);if(slot.innerHTML){slot.innerHTML='';return}try{const d=await api('/pdf-notes/'+id);slot.innerHTML=`<div class="notes-output">${noteMarkup(d.notes)}</div>`}catch(x){err(x)}}
async function board(id,input){if(!input.files[0])return;const f=new FormData();f.append('file',input.files[0]);try{await post('/lectures/'+id+'/board',f);poll()}catch(x){err(x)}}
async function showLec(id){const slot=$(`lec${id}`);if(slot.innerHTML){slot.innerHTML='';return}try{const l=await api('/lectures/'+id);slot.innerHTML=l.notes.map(u=>`<div class="notes-output"><h3>${esc(u.unit)}</h3>`+u.points.map(p=>`<p><b>${esc(p.heading)}</b> <span class="topbar-note">${esc(p.ts||'')}</span><br>${esc(p.text)}</p>`).join('')+u.board.map(b=>`<div class="item-card"><b>From the board: ${esc(b.title)}</b><pre>${esc(b.markdown)}</pre></div>`).join('')+'</div>').join('')||'<div class="empty-card">No notes yet.</div>'}catch(x){err(x)}}
function tSyl(){const u=D.subject.units;$('tab').innerHTML=`<div class="section-heading"><div><div class="section-kicker">THE COURSE MAP</div><h3>Build your syllabus map</h3><p>Give your lectures a structure and keep each idea in the right unit.</p></div></div><form class="action-card" onsubmit="send(event,'/subjects/${sid}/syllabus')"><div class="form-stack"><label for="syllabusText">Paste syllabus text</label><textarea class="input" id="syllabusText" name="text" placeholder="Unit 1: ER model, keys, normalization…"></textarea><div class="upload-row"><input type="file" name="file" accept=".txt,.pdf" aria-label="Or upload a syllabus"><button class="primary" type="submit">Organize into units ↗</button></div></div><div class="privacy-note">◉ Parsed and organized locally</div></form><div class="list-heading"><h3>Your unit map</h3><span>${u.length} ${u.length===1?'unit':'units'}</span></div>${u.length?`<div class="unit-list">${u.map((x,i)=>`<article class="unit-card"><div class="unit-number">${String(i+1).padStart(2,'0')}</div><h3>${esc(x.name)}</h3><div>${(x.topics||[]).map(t=>`<span class="topic-chip">${esc(t)}</span>`).join('')||'<span class="topbar-note">Topics will appear here</span>'}</div></article>`).join('')}</div>`:'<div class="empty-card">Add a syllabus above and your course map will take shape. 🧭</div>'}`}
function b64(text){return btoa(unescape(encodeURIComponent(String(text??''))))}
function fromB64(text){return decodeURIComponent(escape(atob(text)))}
function tStudy(){const c=D.cards,by=k=>c.filter(x=>x.kind==k);$('tab').innerHTML=`<div class="section-heading"><div><div class="section-kicker">ACTIVE RECALL</div><h3>Practice makes it stick.</h3><p>Flip a card, take a quick quiz, or talk through a viva answer.</p></div><span class="hero-chip">${c.length} practice prompts</span></div>`+(c.length?`${by('flash').length?`<section class="study-section"><div class="list-heading"><h3>Flashcards <span class="topbar-note">· tap to flip</span></h3></div><div class="card-grid">${by('flash').map(x=>`<button class="flash-card" onclick="flipCard(this,'${b64(x.q)}','${b64(x.a)}')">${esc(x.q)}</button>`).join('')}</div></section>`:''}${by('quiz').length?`<section class="study-section"><div class="list-heading"><h3>Quick quiz</h3><span>Choose an answer</span></div>${by('quiz').map(x=>{const e=JSON.parse(x.extra||'{}');return `<div class="item-card"><strong>${esc(x.q)}</strong>${(e.options||[]).map((o,i)=>`<label class="quiz-option"><input type="radio" name="q${x.id}" onchange="quizResult(this,${i===e.answer},'${b64(e.options[e.answer]||'')}')">${esc(o)}</label>`).join('')}<div class="quiz-result topbar-note"></div></div>`}).join('')}</section>`:''}${by('viva').length?`<section class="study-section"><div class="list-heading"><h3>Viva warm-up</h3></div>${by('viva').map(x=>`<details class="item-card"><summary><b>${esc(x.q)}</b>${x.lab_id?'<span class="topic-chip">Lab</span>':''}</summary><p style="margin:12px 0 0">${esc(x.a)}</p></details>`).join('')}</section>`:''}`:'<div class="empty-card">Once a lecture or lab is processed, your flashcards, quiz and viva questions will appear here. 🧠</div>')}
function flipCard(button,q,a){button.dataset.flip=button.dataset.flip?'':'1';button.classList.toggle('flipped',!!button.dataset.flip);button.textContent=fromB64(button.dataset.flip?a:q)}
function quizResult(input,correct,answer){const result=input.closest('.item-card').querySelector('.quiz-result');result.textContent=correct?'That’s right! ✨':`Not quite — the answer is ${fromB64(answer)}`;result.style.color=correct?'var(--forest)':'var(--coral)'}
async function editManualOutputs(id){
 try{
  const manual=await api('/lab-manuals/'+id),editor=$('manualEditor');
  editor.innerHTML=`<section class="action-card manual-output-review"><h3>Review experiment outputs</h3><p>Expected outputs are filled in for you. Replace any with the output from your own run, or leave them blank to use the generated expected output in the final PDF.</p>
   <form onsubmit="finalizeManual(event,${id})">${manual.experiments.map((experiment,i)=>`<div class="study-section"><h4>${i+1}. ${esc(experiment.title)}</h4><label>Generated expected output (used if your actual output is blank)</label><pre class="notes-output">${esc(experiment.expected_output||'No expected output was generated.')}</pre><label for="manualOutput${i}">Your actual run output (optional)</label><textarea class="input manual-index" id="manualOutput${i}" maxlength="10000" placeholder="Optional: paste the result from running this experiment">${esc(experiment.actual_output||'')}</textarea></div>`).join('')}
   <div class="manual-notice">Generated expected outputs are guidance and can vary with your setup. Adding your own run output replaces the expected output for that experiment in the PDF.</div><button class="primary" type="submit" style="margin-top:12px">Save outputs &amp; create final PDF ↗</button></form></section>`;
  editor.scrollIntoView({behavior:'smooth',block:'start'});
 }catch(error){err(error)}
}
async function finalizeManual(event,id){
 event.preventDefault();
 const form=event.target,outputs=[...form.querySelectorAll('textarea')].map(field=>field.value),printWindow=window.open('about:blank','_blank');
 if(!printWindow){err(new Error('Allow pop-ups to open the final printable manual.'));return}
 const button=form.querySelector('button[type=submit]');button.disabled=true;
 try{await J('/lab-manuals/'+id+'/outputs',{outputs});printWindow.location='/lab-manuals/'+id+'/print'}
 catch(error){printWindow.close();err(error)}
 finally{button.disabled=false}
}
function tLabs(){$('tab').innerHTML=`<div class="section-heading"><div><div class="section-kicker">YOUR OWN WORK, KEPT YOURS</div><h3>Turn an experiment into a record.</h3><p>Draft one verified lab record from your own code and actual output, or create a complete manual draft from an experiment index.</p></div></div>
 <form class="action-card" onsubmit="send(event,'/subjects/${sid}/lab-manuals')"><h3>Build a lab manual from your index</h3><p class="hint">Add one experiment title per line. Study Sloth will draft the supporting sections and a printable manual.</p>
 <div class="student-details"><div class="form-stack"><label for="manualName">Student name</label><input class="input" id="manualName" name="student_name" required maxlength="160"></div><div class="form-stack"><label for="manualClass">Class / year</label><input class="input" id="manualClass" name="class_name" required maxlength="160" placeholder="e.g. B.Tech, Year 2"></div><div class="form-stack"><label for="manualBranch">Branch</label><input class="input" id="manualBranch" name="branch" required maxlength="160" placeholder="e.g. Computer Science"></div><div class="form-stack"><label for="manualCollege">College / institution</label><input class="input" id="manualCollege" name="institution" maxlength="160"></div><div class="form-stack"><label for="manualSemester">Semester</label><input class="input" id="manualSemester" name="semester" maxlength="160"></div><div class="form-stack"><label for="manualRoll">Roll number</label><input class="input" id="manualRoll" name="roll_number" maxlength="160"></div></div>
 <label for="experimentIndex">Experiment index</label><textarea class="input manual-index" id="experimentIndex" name="experiment_index" required maxlength="3000" placeholder="1. Create and query a database table&#10;2. Demonstrate INNER JOIN and LEFT JOIN"></textarea>
 <div class="manual-notice">Generated sections and expected outputs are study guidance. You can add the output from your own run for any experiment; if you leave it blank, the generated expected output will be included in the final PDF.</div>
 <button class="primary" type="submit" style="margin-top:12px">Generate manual draft ↗</button></form>
 <div class="list-heading"><h3>Manual drafts</h3><span>${D.lab_manuals.length} manuals</span></div>${D.lab_manuals.length?`<div class="item-list">${D.lab_manuals.map(m=>`<article class="item-card item-row"><span class="item-icon">📘</span><div class="item-info"><strong>${esc(m.class_name)} · ${esc(m.branch)}</strong><small>${esc(m.student_name)} · ${m.experiment_count} experiments</small><span class="manual-status ${m.status==='error'?'error':''}">${m.status==='done'?'Ready for your run outputs':m.status==='error'?esc(m.message||'Generation failed'):'Generating manual…'}</span></div>${m.status==='done'?`<button class="quiet-button" onclick="editManualOutputs(${m.id})">Enter outputs &amp; finalize ↗</button>`:''}</article>`).join('')}</div>`:'<div class="empty-card">Your generated manual drafts will appear here.</div>'}
 <div id="manualEditor"></div>
 <div class="list-heading"><h3>Individual lab records</h3><span>${D.labs.length} records</span></div><form class="action-card" onsubmit="send(event,'/subjects/${sid}/labs')"><div class="form-stack"><label for="labTitle">Experiment title</label><input class="input" id="labTitle" name="title" required placeholder="Experiment 4: LEFT JOIN on two tables"><label for="labCode">Your code</label><textarea class="input" id="labCode" name="code" required placeholder="Paste code you actually ran"></textarea><label for="labOutput">Output from your real run</label><textarea class="input" id="labOutput" name="output" placeholder="Paste output, or add a screenshot below"></textarea><div class="upload-row"><input type="file" name="file" accept="image/*" aria-label="Output screenshot"><button class="primary" type="submit">Draft verified lab record ↗</button></div></div><div class="privacy-note">◉ This record uses the code and actual output you provide</div></form>
 ${D.labs.length?`<div class="item-list" style="margin-top:10px">${D.labs.map(l=>`<article class="item-card item-row"><span class="item-icon">🧪</span><div class="item-info"><strong>${esc(l.title)}</strong><small>${l.reviewed?'Reviewed and ready to print':'Waiting for your review'}</small></div><button class="quiet-button" onclick="showLab(${l.id})">Review ↗</button></article>`).join('')}</div>`:''}<div id="lab"></div>`}
async function showLab(id){const l=await api('/labs/'+id),r=l.record;if(!r.aim&&!r.theory){$('lab').innerHTML='<div class="empty-card">Your record is still being written…</div>';return}const T=(k,v,h)=>`<label>${k}</label><textarea class="input" id="f_${k}" style="min-height:${h||70}px">${esc(v)}</textarea>`;$('lab').innerHTML=`<div class="action-card"><h3>${esc(l.title)}</h3>${T('aim',r.aim)}${T('theory',r.theory,130)}${T('procedure',r.procedure)}<label>Code you supplied</label><textarea class="input" id="f_code">${esc(l.code)}</textarea><label>Output you supplied</label><textarea class="input" id="f_output">${esc(l.output)}</textarea>${l.output_note?`<div class="warn">${esc(l.output_note)}</div>`:''}${T('conclusion',r.conclusion)}<p>Theory sources: ${(r.sources||[]).map(esc).join('; ')||'No lecture notes matched.'}</p><label><input type="checkbox" id="confirmOutput"> I ran this code and checked the output above.</label><button class="primary" onclick="fin(${id})">Save and open print view</button></div>`}
async function fin(id){const g=k=>$('f_'+k).value;try{await J('/labs/'+id+'/review',{confirmed:$('confirmOutput').checked,code:g('code'),output:g('output'),record:{aim:g('aim'),theory:g('theory'),procedure:g('procedure'),conclusion:g('conclusion')}});window.open('/labs/'+id+'/print')}catch(x){err(x)}}
async function poll(){const j=await api('/jobs'),act=j.filter(x=>x.status==='queued'||x.status==='running'),el=$('jobs'),bad=j[0]?.status==='error'?j[0]:null;el.hidden=!act.length&&!bad;el.innerHTML=act.map(x=>`<span class="job-spark">✦</span><span>${esc(x.kind.replace('_',' '))}: ${esc(x.message)}</span><progress value="${x.progress}" max="1"></progress>`).join('')||(bad?`<span class="job-spark">✦</span><span>Last job failed: ${esc(bad.message)}</span>`:'');if(wasBusy&&!act.length&&sid){D=await api('/subjects/'+sid);await subs();draw()}wasBusy=!!act.length}
async function init(){try{await subs();draw();poll()}catch(x){$('main').innerHTML=`<div class="empty-card"><h2>Study Sloth couldn’t connect</h2><p>${esc(x.message)}</p><button class="primary" onclick="init()">Try again</button></div>`}}
setInterval(()=>poll().catch(()=>{}),2000);init();
</script>
</body>
</html>
